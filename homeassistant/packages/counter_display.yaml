# Counter display: Home Assistant side.
# Drop this file in config/packages/ and make sure configuration.yaml has:
#   homeassistant:
#     packages: !include_dir_named packages
#
# The camera automations at the bottom need:
#   - "Allow the camera" switched on in Counter Home settings on the tablet
#   - an MJPEG IP Camera integration named "Counter display" (entity camera.counter_display),
#     added in Settings > Devices & services; see the README for the URLs
#   - person entities with device trackers, so zone.home counts who is home
#
# secrets.yaml needs (setup.sh prints the token and IP):
#   counter_display_token: "Bearer <token>"
#   counter_display_api: "http://192.168.0.120:2323/{{ path }}"
#   counter_display_status: "http://192.168.0.120:2323/status"

rest_command:
  counter_display:
    url: !secret counter_display_api
    method: post
    headers:
      Authorization: !secret counter_display_token
    timeout: 5

rest:
  - resource: !secret counter_display_status
    headers:
      Authorization: !secret counter_display_token
    scan_interval: 20
    timeout: 5
    sensor:
      - name: Counter display battery
        unique_id: counter_display_battery
        value_template: "{{ value_json.battery }}"
        unit_of_measurement: "%"
        device_class: battery
      - name: Counter display battery temperature
        unique_id: counter_display_battery_temp
        value_template: "{{ value_json.batteryTempC }}"
        unit_of_measurement: "°C"
        device_class: temperature
      - name: Counter display volume
        unique_id: counter_display_volume
        value_template: "{{ value_json.volume }}"
        unit_of_measurement: "%"
    binary_sensor:
      - name: Counter display screen
        unique_id: counter_display_screen
        value_template: "{{ value_json.screenOn }}"
      - name: Counter display on dashboard
        unique_id: counter_display_on_dashboard
        value_template: "{{ value_json.launcherInFront and not value_json.ambient }}"
      - name: Counter display launcher in front
        unique_id: counter_display_launcher_in_front
        value_template: "{{ value_json.launcherInFront }}"
      - name: Counter display camera
        unique_id: counter_display_camera
        value_template: "{{ value_json.camera.running }}"

# Media volume slider for the dashboard. The tablet's side keys are hidden by the bezel, so this,
# the Volume dock tile and POST /volume are the ways to change it. The app's cap still applies.
input_number:
  counter_display_volume:
    name: Counter display volume
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:volume-high

script:
  counter_display:
    alias: Counter display command
    description: Send any API path, e.g. screen/on, ambient/on, home, launch?app=Music
    fields:
      path:
        description: API path
        example: launch?app=Music
    sequence:
      - action: rest_command.counter_display
        data:
          path: "{{ path }}"

automation:
  - id: counter_display_wake
    alias: Counter display, wake when someone walks up
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.counter_presence_presence
        to: "on"
    actions:
      - action: rest_command.counter_display
        data:
          path: screen/on
      - action: rest_command.counter_display
        data:
          # Dim at night, auto brightness during the day.
          path: >-
            {{ 'brightness?value=25' if now().hour >= 22 or now().hour < 6 else 'brightness?value=auto' }}

  - id: counter_display_ambient
    alias: Counter display, clock after 2 minutes alone
    triggers:
      - trigger: state
        entity_id: binary_sensor.counter_presence_presence
        to: "off"
        for: "00:02:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.counter_display_launcher_in_front
        state: "on"
    actions:
      - action: rest_command.counter_display
        data:
          path: ambient/on

  # During the day the clock screen stays up as long as nobody is around. Late at night the panel
  # goes dark instead: 10 minutes after the last person leaves, or at 23:00 if it is already alone.
  - id: counter_display_off
    alias: Counter display, panel off after 10 minutes alone (late night)
    triggers:
      - trigger: state
        entity_id: binary_sensor.counter_presence_presence
        to: "off"
        for: "00:10:00"
      - trigger: time
        at: "23:00:00"
    conditions:
      - condition: time
        after: "23:00:00"
        before: "06:00:00"
      - condition: state
        entity_id: binary_sensor.counter_presence_presence
        state: "off"
        for: "00:10:00"
      # Leaves the screen alone while YouTube TV or IPTV is up.
      - condition: state
        entity_id: binary_sensor.counter_display_launcher_in_front
        state: "on"
    actions:
      - action: rest_command.counter_display
        data:
          path: screen/off

  - id: counter_display_return_home
    alias: Counter display, back to the dashboard after 30 minutes alone
    triggers:
      - trigger: state
        entity_id: binary_sensor.counter_presence_presence
        to: "off"
        for: "00:30:00"
    conditions:
      - condition: state
        entity_id: binary_sensor.counter_display_launcher_in_front
        state: "off"
    actions:
      - action: rest_command.counter_display
        data:
          path: home
      - delay: "00:00:05"
      - if:
          - condition: time
            after: "23:00:00"
            before: "06:00:00"
        then:
          - action: rest_command.counter_display
            data:
              path: screen/off
        else:
          - action: rest_command.counter_display
            data:
              path: ambient/on

  # The line under the clock on the sleep screen: outdoor temperature and sky, from the Venstar's
  # outdoor probe and the NWS weather entity. Sent whenever either changes and every 15 minutes.
  - id: counter_display_ambient_info
    alias: Counter display, outdoor temperature on the clock screen
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id:
          - sensor.main_outdoor_temperature_2
          - weather.kgcc_daynight
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
    actions:
      - variables:
          sky: >-
            {% set names = {'sunny': 'Sunny', 'clear-night': 'Clear', 'partlycloudy': 'Partly cloudy',
              'cloudy': 'Cloudy', 'rainy': 'Rain', 'pouring': 'Heavy rain', 'lightning': 'Thunderstorms',
              'lightning-rainy': 'Thunderstorms', 'snowy': 'Snow', 'snowy-rainy': 'Sleet', 'hail': 'Hail',
              'fog': 'Fog', 'windy': 'Windy', 'windy-variant': 'Windy'} %}
            {{ names.get(states('weather.kgcc_daynight'), '') }}
          temperature: "{{ states('sensor.main_outdoor_temperature_2') }}"
      - action: rest_command.counter_display
        data:
          path: >-
            {% if is_number(temperature) %}
            ambient/info?temperature={{ temperature | round(0) | int }}&unit={{ '°F' | urlencode }}&condition={{ sky | urlencode }}
            {% else %}
            ambient/info?line={{ sky | urlencode }}
            {% endif %}

  - id: counter_display_battery_guard
    alias: Counter display, warn if the battery runs hot
    triggers:
      - trigger: numeric_state
        entity_id: sensor.counter_display_battery_temperature
        above: 42
        for: "00:05:00"
    actions:
      - action: persistent_notification.create
        data:
          title: Counter display
          message: >-
            Tablet battery is at {{ states('sensor.counter_display_battery_temperature') }} °C.
            Check the tray vents and that Battery protection is still set to Maximum.

  # ---------------------------------------------------------------- camera (optional)
  - id: counter_display_camera_away
    alias: Counter display, camera on when everyone has left
    triggers:
      - trigger: numeric_state
        entity_id: zone.home
        below: 1
        for: "00:05:00"
    actions:
      - action: rest_command.counter_display
        data:
          path: camera/on

  - id: counter_display_camera_home
    alias: Counter display, camera off when someone is home
    triggers:
      - trigger: numeric_state
        entity_id: zone.home
        above: 0
    actions:
      - action: rest_command.counter_display
        data:
          path: camera/off

  - id: counter_display_camera_motion_away
    alias: Counter display, snapshot when someone is seen while away
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.counter_presence_presence
        to: "on"
    conditions:
      - condition: numeric_state
        entity_id: zone.home
        below: 1
    actions:
      # Make sure the camera is running (the wake automation also turns the screen on, which
      # lights the room a little). minutes=15 turns it back off if nobody turns it off sooner.
      - action: rest_command.counter_display
        data:
          path: camera/on?minutes=15
      - delay: "00:00:02"
      - action: camera.snapshot
        target:
          entity_id: camera.counter_display
        data:
          filename: /config/www/counter_display/last_motion.jpg
      - action: persistent_notification.create
        data:
          title: Movement at the counter
          message: >-
            The counter display saw someone at {{ now().strftime('%H:%M') }} while nobody was home.

            ![snapshot](/local/counter_display/last_motion.jpg?{{ now().timestamp() | int }})
      # For a phone notification, add your mobile app notifier, for example:
      # - action: notify.mobile_app_your_phone
      #   data:
      #     message: Movement at the counter
      #     data:
      #       image: /local/counter_display/last_motion.jpg
      - delay: "00:01:00"   # at most one snapshot a minute

  - alias: Counter display set volume from slider
    id: counter_display_set_volume
    triggers:
      - trigger: state
        entity_id: input_number.counter_display_volume
    actions:
      - action: rest_command.counter_display
        data:
          path: "volume?value={{ states('input_number.counter_display_volume') | int }}"
