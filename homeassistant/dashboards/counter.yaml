  # ------------------------------------------------------------------ Hot tub
  - title: Hot Tub
    path: hot-tub
    icon: mdi:hot-tub
    type: sections
    max_columns: 3
    background: *wallpaper
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:button-card
            template: title
            variables: { title: Hot Tub }
            grid_options: { columns: 12, rows: 1 }
          - type: custom:button-card
            template: nav
            variables: { active: hot-tub }
            grid_options: { columns: 24, rows: 1 }

      - type: grid
        cards:
          - type: thermostat
            entity: climate.hot_tub_temperature
            name: " "
            show_current_as_primary: true
            grid_options: { columns: 12, rows: 5 }
          - { <<: *heading, name: Last 24 hours }
          - type: custom:mini-graph-card
            hours_to_show: 24
            points_per_hour: 4
            line_width: 3
            height: 112
            lower_bound: ~96
            upper_bound: ~106
            entities:
              - entity: sensor.hot_tub_current_temperature
                name: Water
                color: "#64d2ff"
              - entity: sensor.hot_tub_target_temperature
                name: Set point
                color: "#ff9f0a"
                show_fill: false
            show:
              name: false
              icon: false
              state: false
              legend: false
              labels: false
              extrema: false
              fill: fade
            grid_options: { columns: 12, rows: 2 }

      - type: grid
        cards:
          - { <<: *heading, name: Jets & lights }
          - { <<: *toggle, entity: fan.hot_tub_jets_1, name: Jets 1, icon: mdi:fan, variables: { tint: "#0a84ff" } }
          - { <<: *toggle, entity: fan.hot_tub_jets_2, name: Jets 2, icon: mdi:fan, variables: { tint: "#0a84ff" } }
          - { <<: *toggle, entity: switch.hot_tub_lights, name: Lights, icon: mdi:lightbulb-spot, variables: { tint: "#af52de" } }
          - { <<: *info, entity: select.hot_tub_color_cycle_speed, name: Colour cycle, icon: mdi:sync }
          - { <<: *heading, name: Colours }
          - { <<: *info, entity: select.hot_tub_color_underwater, name: Underwater, icon: mdi:waves }
          - { <<: *info, entity: select.hot_tub_color_exterior, name: Exterior, icon: mdi:wall-sconce-flat }
          - { <<: *info, entity: select.hot_tub_color_bartop, name: Bar top, icon: mdi:glass-cocktail }
          - { <<: *info, entity: select.hot_tub_color_pillow, name: Pillow, icon: mdi:sofa-single }
          - { <<: *heading, name: Power }
          - { <<: *info, entity: sensor.hot_tub_heater_power, name: Heater, icon: mdi:radiator }
          - { <<: *info, entity: sensor.hot_tub_pumps_power, name: Pumps, icon: mdi:pump }

      - type: grid
        cards:
          - { <<: *heading, name: Water care }
          - { <<: *info, entity: sensor.hot_tub_salt_content, name: Salt level, icon: mdi:shaker-outline }
          - { <<: *info, entity: number.hot_tub_salt_power, name: Salt output, icon: mdi:shaker }
          - { <<: *toggle, entity: switch.hot_tub_salt_boost, name: Salt boost, icon: mdi:rocket-launch, variables: { tint: "#30b0c7" } }
          - { <<: *toggle, entity: switch.hot_tub_clean_cycle, name: Clean cycle, icon: mdi:broom, variables: { tint: "#30b0c7" } }
          - { <<: *heading, name: Locks & timers }
          - { <<: *toggle, entity: switch.hot_tub_spa_lock, name: Spa lock, icon: mdi:lock, variables: { tint: "#ff3b30" } }
          - { <<: *toggle, entity: switch.hot_tub_temperature_lock, name: Temp lock, icon: mdi:lock-clock, variables: { tint: "#ff3b30" } }
          - { <<: *toggle, entity: switch.hot_tub_summer_timer, name: Summer, icon: mdi:weather-sunny }
          - { <<: *info, entity: binary_sensor.hot_tub_salt_level_confirmed, name: Salt check, icon: mdi:check-decagram, variables: { lit: false, text: "[[[ return entity.state === 'on' ? 'Confirmed' : 'Not confirmed' ]]]" } }
          - { <<: *heading, name: Temperatures }
          - { <<: *info, entity: sensor.hot_tub_heater_outlet, name: Heater outlet, icon: mdi:thermometer-water }
          - { <<: *info, entity: sensor.hot_tub_controller_temperature, name: Controller, icon: mdi:chip }

