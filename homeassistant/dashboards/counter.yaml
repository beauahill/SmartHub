          - { <<: *toggle, entity: light.garage_bulb_2, name: Bulb 2, icon: mdi:lightbulb }
          - { <<: *toggle, entity: light.garage_bulb_3, name: Bulb 3, icon: mdi:lightbulb }

      - type: grid
        cards:
          - { <<: *heading, name: Outdoor }
          - { <<: *toggle, entity: switch.front_porch, name: Front porch, icon: mdi:coach-lamp }
          - { <<: *toggle, entity: light.back_porch_light_switch_light, name: Back porch, icon: mdi:coach-lamp-variant }
          - { <<: *toggle, entity: switch.back_patio_lights, name: Patio lights, icon: mdi:string-lights, variables: { tint: "#ff375f" } }
          - { <<: *toggle, entity: input_boolean.landscapelt_toggle, name: Landscape, icon: mdi:spotlight-beam, variables: { tint: "#30b457" } }
          - { <<: *toggle, entity: switch.hot_tub_lights, name: Hot tub, icon: mdi:hot-tub, variables: { tint: "#af52de" } }
          - { <<: *heading, name: Everything }
          - <<: *summary
            name: All lights off
            icon: mdi:power
            custom_fields: { c: "" }
            variables:
              tint: "#ffd60a"
              ids: *lights
              alert: "[[[ return variables.ids.some((id) => states[id] && states[id].state === 'on') ]]]"
              text: |
                [[[
                  const n = variables.ids.filter((id) => states[id] && states[id].state === 'on').length;
                  return n === 0 ? 'Nothing is on' : n === 1 ? '1 light on' : n + ' lights on';
                ]]]
            tap_action:
              action: perform-action
              perform_action: homeassistant.turn_off
              target:
                entity_id: *lights
              confirmation:
                text: Turn every light off?

