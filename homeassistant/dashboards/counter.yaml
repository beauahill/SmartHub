# Counter display dashboard (url_path: dashboard-counter).
#
# Seven views (plus the All tasks subview) for the 11" tablet in landscape, kiosk mode (header and sidebar hidden). Each view is
# one screen with no scrolling: a title and a navigation pill on top, then three columns of glass
# tiles over the wallpaper. A tile that is "on" (a light, an open door, an unlocked lock) turns
# white; everything else stays dark glass. Tap a tile to act, hold it for the details.
#
# Push it to Home Assistant with
#   python3 homeassistant/scripts/push_dashboard.py
# which saves it as the storage-mode dashboard "dashboard-counter" (see the README).
#
# Custom cards used (installed through HACS): button-card (v7 or newer), mini-graph-card and
# kiosk-mode. Everything else is a core card. The look does not depend on the Home Assistant theme
# or on card-mod: the tiles are button-card templates that carry their own colours, and the "title"
# template sets the glass variables on the view for the few core cards (weather, thermostat,
# calendar, camera).

title: Counter

# HACS kiosk-mode: hide the header and sidebar for the tablet's non-admin "counter" user even
# after navigating between views (the ?kiosk URL parameter only applies to the first page load).
# Admins opening this dashboard on a phone keep the normal header.
kiosk_mode:
  non_admin_settings:
    kiosk: true

# ---------------------------------------------------------------------------------------------
# Shared lists. "_defs" is only a place to hang YAML anchors; push_dashboard.py drops it.
# ---------------------------------------------------------------------------------------------
_defs:
  wallpaper: &wallpaper
    image: /api/image/serve/7de7010cecc4d3ebe21c8a996e618523/original
    size: cover
    attachment: fixed

  calendars: &calendars
    - calendar.hillhomeassistant_gmail_com   # shared household Google calendar
    - calendar.birthdays
    - calendar.campbell_county_events
    - calendar.rockpile_museum
    - calendar.gillette_college
    - calendar.pronghorn_home_games
    - calendar.gillette_wild_home_games

  lights: &lights
    - light.lr_lamp_dimmer
    - light.lr_lamp_dimmer_2
    - light.kauf_bulb_304d85_kauf_bulb
    - light.workout_room_dimmer_switch_light
    - light.man_cave
    - light.bar_lights
    - light.back_bar
    - switch.garage_lights_main
    - switch.garageworkbenchlights
    - switch.garage_kennel_lights
    - light.kauf_garage_patio
    - light.garage_bulb_1
    - light.garage_bulb_2
    - light.garage_bulb_3
    - switch.front_porch
    - light.back_porch_light_switch_light
    - switch.back_patio_lights
    - switch.hot_tub_lights

  openings: &openings
    - binary_sensor.door_front_window_door_is_open
    - binary_sensor.door_back_porch_window_door_is_open
    - binary_sensor.door_w_garage_entry_window_door_is_open
    - binary_sensor.single_garage
    - binary_sensor.double_garage
    - binary_sensor.window_kitchen_window_door_is_open
    - binary_sensor.window_kitchen_2_window_door_is_open
    - binary_sensor.window_dining_window_door_is_open
    - binary_sensor.window_dining_2_window_door_is_open
    - binary_sensor.window_bedroom_e_window_door_is_open
    - binary_sensor.window_bedroom_w_window_door_is_open

  locks: &locks
    - lock.touchscreen_deadbolt_z_wave_plus
    - lock.w_garage_entry_deadbolt
    - lock.touchscreen_deadbolt_z_wave_plus_2

  # Home maintenance: one date helper per task in homeassistant/maintenance/tasks.yaml, holding
  # the date it is next due (2000-01-01 = not set yet). setup_maintenance.py creates them and
  # warns when this list and tasks.yaml disagree. "Up next" sorts these by due date.
  upkeep_tasks: &upkeep_tasks
    - input_datetime.maint_hot_tub_test
    - input_datetime.maint_hot_tub_water
    - input_datetime.maint_hot_tub_cartridge
    - input_datetime.maint_hot_tub_filter_rinse
    - input_datetime.maint_hot_tub_filter_soak
    - input_datetime.maint_hot_tub_filter_replace
    - input_datetime.maint_hot_tub_cover
    - input_datetime.maint_furnace_filter
    - input_datetime.maint_humidifier_pad
    - input_datetime.maint_hvac_service
    - input_datetime.maint_heat_pump_coil
    - input_datetime.maint_uv_lamp
    - input_datetime.maint_water_heater_flush
    - input_datetime.maint_water_heater_filter
    - input_datetime.maint_fridge_filter
    - input_datetime.maint_dryer_vent
    - input_datetime.maint_range_hood
    - input_datetime.maint_sprinkler_blowout
    - input_datetime.maint_sprinkler_startup
    - input_datetime.maint_hose_bibs
    - input_datetime.maint_gutters
    - input_datetime.maint_garage_doors
    - input_datetime.maint_smoke_test
    - input_datetime.maint_smoke_batteries
    - input_datetime.maint_fire_extinguisher
    - input_datetime.maint_fireplace

# ---------------------------------------------------------------------------------------------
# button-card templates. Colours: white 96% for type, 62% for second lines; tiles are dark glass
# (rgba 22 24 34 at 44%) and turn 94% white when on, with near-black type.
# ---------------------------------------------------------------------------------------------
button_card_templates:
  # View title with today's date above it, straight on the wallpaper. Every view has one, so it
  # also sets the look of the whole view: the "glass" variables below are written onto the
  # sections view, where the grid and the core cards (weather, thermostat, calendar, camera)
  # pick them up. Grid: 72 px rows, 10 px gaps, 28 px between columns.
  title:
    section_mode: true
    show_icon: false
    show_name: true
    show_label: true
    tap_action: { action: none }
    hold_action: { action: none }
    variables:
      title: ""
      glass:
        "--ha-section-grid-row-height": 72px
        "--ha-section-grid-row-gap": 10px
        "--ha-section-grid-column-gap": 10px
        "--ha-view-sections-column-gap": 28px
        "--ha-view-sections-row-gap": 20px
        "--ha-card-background": rgba(22, 24, 34, 0.44)
        "--card-background-color": rgba(22, 24, 34, 0.44)
        "--ha-card-border-radius": 20px
        "--ha-card-border-width": 0px
        "--ha-card-box-shadow": inset 0 0.5px 0 0 rgba(255, 255, 255, 0.20), 0 10px 30px -12px rgba(0, 0, 0, 0.35)
        "--ha-card-backdrop-filter": blur(24px) saturate(1.6)
        "--primary-text-color": rgba(255, 255, 255, 0.96)
        "--rgb-primary-text-color": 255, 255, 255
        "--text-primary-color": "#1d1d1f"
        "--secondary-text-color": rgba(235, 235, 245, 0.62)
        "--ha-color-text-secondary": rgba(235, 235, 245, 0.62)
        "--disabled-text-color": rgba(235, 235, 245, 0.32)
        "--divider-color": rgba(255, 255, 255, 0.10)
        "--primary-color": "#ff9f0a"
        "--accent-color": "#ff9f0a"
        "--state-inactive-color": rgba(235, 235, 245, 0.55)
    name: "[[[ return variables.title ]]]"
    label: |
      [[[
        let view = this;
        while (view && view.localName !== 'hui-sections-view') view = view.parentNode || view.host;
        if (view && view.dataset.glass !== '1') {
          view.dataset.glass = '1';
          Object.entries(variables.glass).forEach(([name, value]) => view.style.setProperty(name, value));
        }
        void states['sun.sun'];   // re-render through the day, so the date rolls over
        return new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
      ]]]
    styles:
      card:
        - background: none
        - box-shadow: none
        - backdrop-filter: none
        - -webkit-backdrop-filter: none
        - border: none
        - border-radius: 0
        - padding: 0 6px
        - cursor: default
        - overflow: visible
      grid:
        - grid-template-areas: '"l" "n"'
        - grid-template-columns: 1fr
        - grid-template-rows: min-content min-content
        - align-content: center
        - row-gap: 1px
      name:
        - justify-self: start
        - font-size: 34px
        - font-weight: 700
        - letter-spacing: -0.5px
        - line-height: 40px
        - color: "#fff"
      label:
        - justify-self: start
        - font-size: 13px
        - font-weight: 600
        - letter-spacing: 0.7px
        - text-transform: uppercase
        - color: rgba(235, 235, 245, 0.62)

  # One entry in the navigation pill. variables: path (view path), active (current view path),
  # dot (true shows a small orange dot after the name).
  nav_item:
    show_icon: true
    show_name: true
    layout: icon_name
    size: 20px
    variables:
      dot: false
    custom_fields:
      dot: ""
    tap_action:
      action: navigate
      navigation_path: "[[[ return '/' + window.location.pathname.split('/')[1] + '/' + variables.path ]]]"
    hold_action: { action: none }
    styles:
      card:
        - height: 44px
        - padding: 0 16px 0 12px
        - border-radius: 22px
        - border: none
        - backdrop-filter: none
        - -webkit-backdrop-filter: none
        - background: "[[[ return variables.path === variables.active ? 'rgba(255, 255, 255, 0.94)' : 'transparent' ]]]"
        - box-shadow: "[[[ return variables.path === variables.active ? '0 4px 14px -4px rgba(0, 0, 0, 0.35)' : 'none' ]]]"
        - color: "[[[ return variables.path === variables.active ? '#1d1d1f' : 'rgba(255, 255, 255, 0.86)' ]]]"
      grid:
        - grid-template-areas: "[[[ return variables.dot ? '\"i n dot\"' : '\"i n\"' ]]]"
        - grid-template-columns: "[[[ return variables.dot ? 'min-content min-content 7px' : 'min-content min-content' ]]]"
        - column-gap: 7px
        - justify-content: center
      custom_fields:
        dot:
          - display: "[[[ return variables.dot ? 'block' : 'none' ]]]"
          - width: 7px
          - height: 7px
          - border-radius: 50%
          - background: "#ff9f0a"
      img_cell:
        - width: 20px
        - height: 20px
      icon:
        - width: 20px
        - height: 20px
        - color: "[[[ return variables.path === variables.active ? '#1d1d1f' : 'rgba(255, 255, 255, 0.86)' ]]]"
      name:
        - font-size: 14px
        - font-weight: 600
        - letter-spacing: 0.1px
        - white-space: nowrap

  # The navigation pill itself, right-aligned. variables: active (current view path).
  # Upkeep gets an orange dot while a maintenance job is due today or overdue.
  nav:
    section_mode: true
    show_icon: false
    show_name: false
    triggers_update: *upkeep_tasks
    variables:
      upkeep_tasks: *upkeep_tasks
      upkeep_due: |
        [[[
          const today = new Date().toLocaleDateString('en-CA');   // YYYY-MM-DD, local
          return variables.upkeep_tasks.some((id) => {
            const s = states[id] && states[id].state;
            return /^\d{4}-\d{2}-\d{2}$/.test(s || '') && s > '2001' && s <= today;
          });
        ]]]
    tap_action: { action: none }
    hold_action: { action: none }
    styles:
      card:
        - background: none
        - box-shadow: none
        - backdrop-filter: none
        - -webkit-backdrop-filter: none
        - border: none
        - border-radius: 0
        - padding: 0
        - cursor: default
        - overflow: visible
        - display: flex
        - align-items: center
        - justify-content: flex-end
      grid:
        - width: fit-content
        - height: 52px
        - box-sizing: border-box
        - padding: 4px
        - border-radius: 26px
        - background: rgba(22, 24, 34, 0.44)
        - backdrop-filter: blur(24px) saturate(1.6)
        - -webkit-backdrop-filter: blur(24px) saturate(1.6)
        - box-shadow: inset 0 0.5px 0 0 rgba(255, 255, 255, 0.20), 0 10px 30px -12px rgba(0, 0, 0, 0.35)
        - grid-template-areas: '"home lights security tub media upkeep calendar"'
        - grid-template-columns: repeat(7, min-content)
        - grid-template-rows: 44px
        - column-gap: 2px
    custom_fields:
      home:
        card:
          type: custom:button-card
          template: nav_item
          name: Home
          icon: mdi:home-variant
          variables: { path: home, active: "[[[ return variables.active ]]]" }
      lights:
        card:
          type: custom:button-card
          template: nav_item
          name: Lights
          icon: mdi:lightbulb
          variables: { path: lights, active: "[[[ return variables.active ]]]" }
      security:
        card:
          type: custom:button-card
          template: nav_item
          name: Security
          icon: mdi:shield-home
          variables: { path: security, active: "[[[ return variables.active ]]]" }
      tub:
        card:
          type: custom:button-card
          template: nav_item
          name: Hot Tub
          icon: mdi:hot-tub
          variables: { path: hot-tub, active: "[[[ return variables.active ]]]" }
      media:
        card:
          type: custom:button-card
          template: nav_item
          name: Media
          icon: mdi:television-play
          variables: { path: media, active: "[[[ return variables.active ]]]" }
      upkeep:
        card:
          type: custom:button-card
          template: nav_item
          name: Upkeep
          icon: mdi:hammer-wrench
          variables: { path: upkeep, active: "[[[ return variables.active ]]]", dot: "[[[ return variables.upkeep_due ]]]" }
      calendar:
        card:
          type: custom:button-card
          template: nav_item
          name: Calendar
          icon: mdi:calendar-blank
          variables: { path: calendar, active: "[[[ return variables.active ]]]" }

  # Section heading: plain type on the wallpaper. Give it grid_options rows: auto.
  heading:
    show_icon: false
    show_name: true
    tap_action: { action: none }
    hold_action: { action: none }
    styles:
      card:
        - background: none
        - box-shadow: none
        - backdrop-filter: none
        - -webkit-backdrop-filter: none
        - border: none
        - border-radius: 0
        - padding: 6px 6px 0
        - height: 30px
        - cursor: default
      name:
        - justify-self: start
        - align-self: end
        - font-size: 17px
        - font-weight: 600
        - letter-spacing: -0.1px
        - color: rgba(255, 255, 255, 0.92)

  # The tile: icon in a circle, name, one line of state. This is the base for the others.
  # variables:
  #   lit     true turns the tile white (default: the entity is on / open / unlocked)
  #   accent  true tints the icon while the tile stays dark (a thermostat that is heating)
  #   tint    the icon colour while lit or accented
  #   text    the second line (default: the state as Home Assistant words it; lights show their %)
  tile:
    section_mode: true
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    size: 22px
    label: "[[[ return variables.text ]]]"
    tap_action: { action: more-info }
    hold_action: { action: more-info }
    variables:
      tint: "#ff9f0a"
      accent: false
      lit: |
        [[[
          if (!entity) return false;
          const domain = entity.entity_id.split('.')[0];
          if (domain === 'lock') return ['unlocked', 'unlocking', 'open', 'jammed'].includes(entity.state);
          if (domain === 'cover') return ['open', 'opening', 'closing'].includes(entity.state);
          if (domain === 'climate' || domain === 'alarm_control_panel') return false;
          return entity.state === 'on';
        ]]]
      text: |
        [[[
          if (!entity) return '';
          if (entity.state === 'unavailable' || entity.state === 'unknown') return 'No response';
          const domain = entity.entity_id.split('.')[0];
          if (domain === 'light' && entity.state === 'on' && entity.attributes.brightness)
            return Math.round(entity.attributes.brightness / 2.55) + '%';
          if (domain === 'climate') {
            const now = entity.attributes.current_temperature;
            const action = entity.attributes.hvac_action || entity.state;
            return (now == null ? '' : Math.round(now) + '° · ') + action.charAt(0).toUpperCase() + action.slice(1);
          }
          return helpers.localize(entity);
        ]]]
    styles:
      card:
        - padding: 0 10px 0 12px
        - transition: background-color 0.25s ease
        - opacity: "[[[ return entity && entity.state === 'unavailable' ? 0.55 : 1 ]]]"
        - background: "[[[ return variables.lit ? 'rgba(255, 255, 255, 0.94)' : 'rgba(22, 24, 34, 0.44)' ]]]"
        - backdrop-filter: "[[[ return variables.lit ? 'none' : 'blur(24px) saturate(1.6)' ]]]"
        - -webkit-backdrop-filter: "[[[ return variables.lit ? 'none' : 'blur(24px) saturate(1.6)' ]]]"
        - border: none
        - border-radius: 20px
        - box-shadow: "[[[ return variables.lit ? '0 10px 30px -12px rgba(0, 0, 0, 0.45)' : 'inset 0 0.5px 0 0 rgba(255, 255, 255, 0.20), 0 10px 30px -12px rgba(0, 0, 0, 0.35)' ]]]"
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 38px 1fr
        - grid-template-rows: 1fr 1fr
        - column-gap: 11px
      img_cell:
        - width: 38px
        - height: 38px
        - border-radius: 50%
        - align-self: center
        - background: "[[[ return variables.lit || variables.accent ? variables.tint + '33' : 'rgba(255, 255, 255, 0.12)' ]]]"
      icon:
        - width: 22px
        - height: 22px
        - color: "[[[ return variables.lit || variables.accent ? variables.tint : 'rgba(255, 255, 255, 0.86)' ]]]"
      name:
        - justify-self: start
        - align-self: end
        - max-width: 100%
        - font-size: 15px
        - font-weight: 600
        - line-height: 20px
        - color: "[[[ return variables.lit ? '#1d1d1f' : 'rgba(255, 255, 255, 0.96)' ]]]"
      label:
        - justify-self: start
        - align-self: start
        - max-width: 100%
        - font-size: 13px
        - line-height: 18px
        - color: "[[[ return variables.lit ? 'rgba(60, 60, 67, 0.72)' : 'rgba(235, 235, 245, 0.62)' ]]]"

  # A switchable thing (light, switch, fan): tap toggles it, hold opens brightness and the rest.
  toggle:
    template: tile
    tap_action: { action: toggle }
    variables:
      tint: "#ffb800"

  # A door, window or garage sensor: white while open.
  opening:
    template: tile
    variables:
      tint: "#ff9500"
      text: |
        [[[
          if (entity.state === 'unavailable' || entity.state === 'unknown') return 'No response';
          if (entity.entity_id.startsWith('cover.')) return entity.state.charAt(0).toUpperCase() + entity.state.slice(1);
          return entity.state === 'on' ? 'Open' : 'Closed';
        ]]]

  # A lock: white while unlocked. Tap asks first, then locks or unlocks.
  lock:
    template: tile
    icon: "[[[ return entity.state === 'locked' ? 'mdi:lock' : 'mdi:lock-open-variant' ]]]"
    variables:
      tint: "#ff9500"
    tap_action:
      action: perform-action
      perform_action: "[[[ return entity.state === 'locked' ? 'lock.unlock' : 'lock.lock' ]]]"
      target:
        entity_id: "[[[ return entity.entity_id ]]]"
      confirmation:
        text: "[[[ return (entity.state === 'locked' ? 'Unlock ' : 'Lock ') + (this._config.name || 'this door').toLowerCase() + '?' ]]]"

  # A thermostat: current temperature and what it is doing; the icon warms up while it heats.
  climate:
    template: tile
    variables:
      accent: "[[[ return ['heating', 'cooling'].includes(entity.attributes.hvac_action) ]]]"
      tint: "[[[ return entity.attributes.hvac_action === 'cooling' ? '#64d2ff' : '#ff9f0a' ]]]"

  # A line that leads to another view: a tile with a chevron. variables: alert, tint, text.
  summary:
    template: tile
    hold_action: { action: none }
    variables:
      lit: false
      accent: "[[[ return variables.alert ]]]"
      alert: false
      text: ""
    styles:
      grid:
        - grid-template-areas: '"i n c" "i l c"'
        - grid-template-columns: 38px 1fr 20px
      custom_fields:
        c:
          - grid-area: c
          - align-self: center
          - color: rgba(235, 235, 245, 0.35)
    custom_fields:
      c: '<ha-icon icon="mdi:chevron-right" style="--mdc-icon-size: 20px;"></ha-icon>'

  # Square shape for a tile: icon top left, name and state bottom left. Use it after a tile
  # template, as in template: [toggle, square].
  square:
    styles:
      card:
        - padding: 14px
      grid:
        - grid-template-areas: '"i" "n" "l"'
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr min-content min-content
      img_cell:
        - justify-self: start
        - align-self: start
        - width: 40px
        - height: 40px

  # The next few events across the calendars (each calendar entity only knows its next event,
  # so this is a glance; the Calendar view has everything). variables: calendars, count.
  agenda:
    section_mode: true
    show_icon: false
    show_name: false
    show_label: false
    tap_action:
      action: navigate
      navigation_path: "[[[ return '/' + window.location.pathname.split('/')[1] + '/calendar' ]]]"
    hold_action: { action: none }
    variables:
      calendars: []
      count: 3
    styles:
      card:
        - padding: 6px 16px
        - background: rgba(22, 24, 34, 0.44)
        - backdrop-filter: blur(24px) saturate(1.6)
        - -webkit-backdrop-filter: blur(24px) saturate(1.6)
        - border: none
        - border-radius: 20px
        - box-shadow: inset 0 0.5px 0 0 rgba(255, 255, 255, 0.20), 0 10px 30px -12px rgba(0, 0, 0, 0.35)
        - color: rgba(255, 255, 255, 0.96)
      grid:
        - grid-template-areas: '"list"'
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr
      custom_fields:
        list:
          - align-self: stretch
          - display: flex
          - flex-direction: column
          - justify-content: space-evenly
          - text-align: left
          - min-width: 0
    extra_styles: |
      .ev { display: grid; grid-template-columns: 76px 1fr; column-gap: 12px; align-items: center; padding: 8px 0; }
      .ev + .ev { border-top: 1px solid rgba(255, 255, 255, 0.09); }
      .ev .d { font-size: 13px; font-weight: 600; color: #ff9f0a; line-height: 18px; }
      .ev .h { font-size: 13px; color: rgba(235, 235, 245, 0.62); line-height: 18px; }
      .ev .t { font-size: 15px; font-weight: 600; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ev .c { font-size: 13px; color: rgba(235, 235, 245, 0.62); line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .none { font-size: 14px; color: rgba(235, 235, 245, 0.62); text-align: center; }
    custom_fields:
      list: |
        [[[
          const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
          const day = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
          const today = day(new Date());
          const events = variables.calendars
            .map((id) => states[id])
            .filter((s) => s && s.attributes.start_time && s.attributes.message)
            .map((s) => ({
              title: s.attributes.message,
              calendar: s.attributes.friendly_name,
              allDay: !!s.attributes.all_day,
              start: new Date(s.attributes.start_time.replace(' ', 'T')),
              end: new Date((s.attributes.end_time || s.attributes.start_time).replace(' ', 'T')),
            }))
            .filter((e) => !isNaN(e.start) && e.end.getTime() >= Date.now() - 60000)
            .sort((a, b) => a.start - b.start)
            .slice(0, variables.count);
          if (!events.length) return '<div class="none">Nothing coming up</div>';
          return events.map((e) => {
            const n = Math.round((day(e.start) - today) / 86400000);
            const d = n <= 0 ? 'Today' : n === 1 ? 'Tomorrow'
              : n < 7 ? e.start.toLocaleDateString('en-US', { weekday: 'long' })
              : e.start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const h = e.allDay ? 'All day' : e.start.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            return `<div class="ev"><div><div class="d">${d}</div><div class="h">${h}</div></div>`
              + `<div style="min-width:0"><div class="t">${esc(e.title)}</div><div class="c">${esc(e.calendar)}</div></div></div>`;
          }).join('');
        ]]]

  # ---- Upkeep (home maintenance; homeassistant/maintenance/tasks.yaml) ----------------------
  # A maintenance job: entity is its date helper (input_datetime.maint_<task>), whose date is when
  # it is next due. The icon warms up a week out and turns red once overdue. Tap asks, then marks
  # it done today (script.maint_done moves the date on and logs it); hold opens the date to set it
  # by hand. variables.e is the date helper's state object, so upkeep_slot can swap in another.
  upkeep_task:
    template: tile
    name: "[[[ return variables.e ? (variables.e.attributes.friendly_name || '').replace(/ due$/, '') : '' ]]]"
    icon: "[[[ return variables.e ? variables.e.attributes.icon || 'mdi:wrench' : 'mdi:check' ]]]"
    variables:
      e: "[[[ return entity ]]]"
      # Days until due (negative: overdue), or null when no date has been set.
      days: |
        [[[
          const s = variables.e && variables.e.state;
          if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '') || s < '2001') return null;
          const [y, m, d] = s.split('-').map(Number);
          const now = new Date();
          return Math.round((new Date(y, m - 1, d) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
        ]]]
      lit: false
      accent: "[[[ return variables.days !== null && variables.days <= 7 ]]]"
      tint: "[[[ return variables.days !== null && variables.days < 0 ? '#ff453a' : '#ff9f0a' ]]]"
      text: |
        [[[
          if (!variables.e) return '';
          const n = variables.days;
          if (n === null) return 'Not set';
          if (n < 0) return (n === -1 ? '1 day' : -n + ' days') + ' overdue';
          if (n === 0) return 'Due today';
          if (n === 1) return 'Due tomorrow';
          if (n < 14) return 'In ' + n + ' days';
          if (n < 56) return 'In ' + Math.round(n / 7) + ' weeks';
          const [y, m, d] = variables.e.state.split('-').map(Number);
          const due = new Date(y, m - 1, d);
          return due.getFullYear() === new Date().getFullYear()
            ? 'Due ' + due.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
            : 'Due ' + due.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
        ]]]
    tap_action:
      action: perform-action
      perform_action: script.maint_done
      data:
        task: "[[[ return variables.e ? variables.e.entity_id.replace('input_datetime.maint_', '') : '' ]]]"
      confirmation:
        text: "[[[ return variables.e ? (variables.e.attributes.friendly_name || '').replace(/ due$/, '') + ': done today?' : '' ]]]"
    hold_action:
      action: more-info
      entity: "[[[ return variables.e ? variables.e.entity_id : '' ]]]"
    styles:
      card:
        - visibility: "[[[ return variables.e ? 'visible' : 'hidden' ]]]"
      name:
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis

  # The Nth most pressing job (index 0 = the most overdue).
  # variables: index, tasks (date helpers to choose from), skip (ones to leave out).
  upkeep_slot:
    template: upkeep_task
    triggers_update: *upkeep_tasks
    variables:
      index: 0
      tasks: *upkeep_tasks
      skip: []
      # Order: overdue and due within 30 days, then jobs with no date yet, then the rest by date.
      e: |
        [[[
          const soon = new Date(Date.now() + 30 * 86400000).toLocaleDateString('en-CA');
          const key = (s) => (!/^\d{4}-\d{2}-\d{2}$/.test(s.state) || s.state < '2001' ? '1'
            : (s.state <= soon ? '0' : '2') + s.state);
          const list = variables.tasks
            .filter((id) => states[id] && !variables.skip.includes(id))
            .map((id) => states[id])
            .sort((a, b) => (key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0));
          return list[variables.index] || null;
        ]]]

  # One hot tub test strip reading (input_number.maint_tub_<id>; 0 = not tested). Tap to type the
  # new value. variables: lo, hi (Hot Spring FreshWater salt targets), low, high (what to do).
  water_reading:
    template: tile
    variables:
      lo: 0
      hi: 0
      low: ""
      high: ""
      v: "[[[ return Number(entity.state) ]]]"
      lit: false
      accent: "[[[ return variables.v > 0 ]]]"
      tint: "[[[ return variables.v >= variables.lo && variables.v <= variables.hi ? '#30d158' : '#ff9f0a' ]]]"
      text: |
        [[[
          const v = variables.v;
          if (!(v > 0)) return 'Not tested · aim ' + variables.lo + '–' + variables.hi;
          const unit = entity.attributes.unit_of_measurement ? ' ' + entity.attributes.unit_of_measurement : '';
          const shown = (entity.attributes.step < 0.5 ? v.toFixed(1) : String(Math.round(v * 10) / 10)) + unit;
          if (v < variables.lo) return shown + ' · Low — ' + variables.low;
          if (v > variables.hi) return shown + ' · High — ' + variables.high;
          return shown + ' · Good (' + variables.lo + '–' + variables.hi + ')';
        ]]]
    styles:
      label:
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis

  # A small glass button inside the "Added" row: logs that a chemical went into the hot tub.
  # variables: chemical (as listed in tasks.yaml).
  dose_chip:
    show_icon: false
    show_name: true
    tap_action:
      action: perform-action
      perform_action: script.maint_tub_dose
      data:
        chemical: "[[[ return variables.chemical ]]]"
      confirmation:
        text: "[[[ return 'Log: added ' + variables.chemical.toLowerCase() + ' to the hot tub?' ]]]"
    hold_action: { action: none }
    styles:
      card:
        - height: 40px
        - padding: 0 12px
        - border-radius: 20px
        - border: none
        - background: rgba(255, 255, 255, 0.12)
        - backdrop-filter: none
        - -webkit-backdrop-filter: none
        - box-shadow: none
      name:
        - font-size: 14px
        - font-weight: 600
        - color: rgba(255, 255, 255, 0.92)
        - white-space: nowrap

  # Low batteries anywhere in the house (phones and watches left out), lowest first.
  # variables: below (percent), count (rows).
  batteries:
    section_mode: true
    show_icon: false
    show_name: false
    triggers_update: all
    tap_action: { action: none }
    hold_action: { action: none }
    variables:
      below: 30
      count: 4
    styles:
      card:
        - padding: 12px 16px
        - background: rgba(22, 24, 34, 0.44)
        - backdrop-filter: blur(24px) saturate(1.6)
        - -webkit-backdrop-filter: blur(24px) saturate(1.6)
        - border: none
        - border-radius: 20px
        - box-shadow: inset 0 0.5px 0 0 rgba(255, 255, 255, 0.20), 0 10px 30px -12px rgba(0, 0, 0, 0.35)
        - color: rgba(255, 255, 255, 0.96)
        - cursor: default
      grid:
        - grid-template-areas: '"list"'
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr
      custom_fields:
        list:
          - align-self: stretch
          - display: flex
          - flex-direction: column
          - justify-content: flex-start
          - text-align: left
          - min-width: 0
    extra_styles: |
      .hd { display: flex; align-items: center; gap: 11px; padding-bottom: 6px; }
      .hd .ic { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; }
      .hd .t { font-size: 15px; font-weight: 600; line-height: 20px; }
      .hd .s { font-size: 13px; line-height: 18px; color: rgba(235, 235, 245, 0.62); }
      .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0 7px 49px; font-size: 14px; line-height: 18px; }
      .row + .row { border-top: 1px solid rgba(255, 255, 255, 0.09); }
      .row .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: rgba(255, 255, 255, 0.92); }
      .row .p { flex: none; font-weight: 600; }
    custom_fields:
      list: |
        [[[
          const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
          const skip = /iphone|ipad|pixel|watch|phone/i;
          const name = (s) => (s.attributes.friendly_name || s.entity_id)
            .replace(/ (battery level|battery|replace battery now)$/i, '');
          const low = Object.values(states)
            .filter((s) => !skip.test(s.entity_id) && s.attributes.device_class === 'battery')
            .map((s) => {
              if (s.entity_id.startsWith('binary_sensor.')) return s.state === 'on' ? { n: name(s), p: 'Replace', v: -1 } : null;
              const v = Number(s.state);
              return s.entity_id.startsWith('sensor.') && s.attributes.unit_of_measurement === '%' && !isNaN(v) && v < variables.below
                ? { n: name(s), p: Math.round(v) + '%', v } : null;
            })
            .filter(Boolean)
            .sort((a, b) => a.v - b.v);
          const n = low.length;
          const head = `<div class="hd"><div class="ic" style="background:${n ? '#ff9f0a33' : 'rgba(255,255,255,0.12)'}">`
            + `<ha-icon icon="${n ? 'mdi:battery-alert-variant-outline' : 'mdi:battery-high'}" style="--mdc-icon-size:22px;color:${n ? '#ff9f0a' : 'rgba(255,255,255,0.86)'}"></ha-icon></div>`
            + `<div><div class="t">Batteries</div><div class="s">${n === 0 ? 'All above ' + variables.below + '%' : n === 1 ? '1 running low' : n + ' running low'}</div></div></div>`;
          const rows = low.slice(0, variables.count).map((b) =>
            `<div class="row"><span class="n">${esc(b.n)}</span><span class="p" style="color:${b.v < 15 ? '#ff453a' : '#ff9f0a'}">${b.p}</span></div>`).join('');
          const more = n > variables.count ? `<div class="row"><span class="n" style="color:rgba(235,235,245,0.62)">and ${n - variables.count} more</span></div>` : '';
          return head + rows + more;
        ]]]

# ---------------------------------------------------------------------------------------------
# Card shorthands (YAML anchors again). Each view: a full-width header row, then three columns.
# A column holds 8 rows at most (a heading counts for half a row), or it runs off the screen.
# ---------------------------------------------------------------------------------------------
_cards:
  heading: &heading { type: custom:button-card, template: heading, grid_options: { columns: 12, rows: auto } }
  toggle: &toggle { type: custom:button-card, template: toggle, grid_options: { columns: 6, rows: 1 } }
  info: &info { type: custom:button-card, template: tile, grid_options: { columns: 6, rows: 1 } }
  opening: &opening { type: custom:button-card, template: opening, grid_options: { columns: 6, rows: 1 } }
  climate: &climate { type: custom:button-card, template: climate, grid_options: { columns: 6, rows: 1 } }
  lock: &lock { type: custom:button-card, template: lock, grid_options: { columns: 12, rows: 1 } }
  summary: &summary { type: custom:button-card, template: summary, grid_options: { columns: 12, rows: 1 } }
  square: &square { type: custom:button-card, template: [tile, square], grid_options: { columns: 4, rows: 2 } }
  task: &task { type: custom:button-card, template: upkeep_task, grid_options: { columns: 6, rows: 1 } }
  slot: &slot { type: custom:button-card, template: upkeep_slot, grid_options: { columns: 12, rows: 1 } }
  reading: &reading { type: custom:button-card, template: water_reading, grid_options: { columns: 12, rows: 1 } }
  # The Ring gate keypad is the only camera that returns pictures right now; camera.gate,
  # driveway, front_door and backyard answer HTTP 500 to snapshot requests.
  gate_camera: &gate_camera
    type: picture-entity
    entity: camera.gate_keypad_live_view
    camera_view: auto
    show_state: false
    show_name: false
    fit_mode: cover
    tap_action: { action: more-info }

views:
  # ------------------------------------------------------------------ Home
  - title: Home
    path: home
    icon: mdi:home-variant
    type: sections
    max_columns: 3
    background: *wallpaper
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:button-card
            template: title
            variables: { title: Home }
            grid_options: { columns: 12, rows: 1 }
          - type: custom:button-card
            template: nav
            variables: { active: home }
            grid_options: { columns: 24, rows: 1 }

      # Column 1: weather, then climate
      - type: grid
        cards:
          - { <<: *heading, name: Weather }
          # NWS (KGCC) is the weather source. It publishes day and night forecasts, not daily
          # ones. (weather.crimson, the met.no entity, reads about 30 °F low here and is not used.)
          - type: weather-forecast
            entity: weather.kgcc_daynight
            name: Gillette
            show_current: true
            show_forecast: true
            forecast_type: hourly
            forecast_slots: 5
            secondary_info_attribute: humidity
            tap_action: { action: more-info }
            grid_options: { columns: 12, rows: 4 }
          - { <<: *heading, name: Climate }
          - <<: *climate
            entity: climate.main
            name: House
            icon: mdi:thermostat
            variables:
              text: |
                [[[
                  const action = entity.attributes.hvac_action || entity.state;
                  const humidity = Number((states['sensor.main_thermostat_humidity_2'] || {}).state);
                  return Math.round(entity.attributes.current_temperature) + '° · '
                    + action.charAt(0).toUpperCase() + action.slice(1)
                    + (isNaN(humidity) ? '' : ' · ' + Math.round(humidity) + '% humidity');
                ]]]
            grid_options: { columns: 12, rows: 1 }
          - <<: *toggle
            entity: switch.fireplace_switch_fireplace_switch
            name: Fireplace
            icon: mdi:fireplace
            variables: { tint: "#ff6b22" }
          - { <<: *climate, entity: climate.garage, name: Garage, icon: mdi:garage }
          - { <<: *climate, entity: climate.office_office_cielo, name: Office, icon: mdi:air-conditioner }
          - { <<: *climate, entity: climate.man_cave, name: Man cave, icon: mdi:air-conditioner }

      # Column 2: garage doors and gate as big tap targets, then what's coming up
      - type: grid
        cards:
          - { <<: *heading, name: Garage & gate }
          - <<: *square
            template: [opening, square]
            entity: binary_sensor.single_garage
            name: Single
            icon: "[[[ return entity.state === 'on' ? 'mdi:garage-open-variant' : 'mdi:garage-variant' ]]]"
            tap_action:
              action: perform-action
              perform_action: switch.turn_on
              target: { entity_id: switch.garage_opener_single }
          - <<: *square
            template: [opening, square]
            entity: binary_sensor.double_garage
            name: Double
            icon: "[[[ return entity.state === 'on' ? 'mdi:garage-open-variant' : 'mdi:garage-variant' ]]]"
            tap_action:
              action: perform-action
              perform_action: switch.turn_on
              target: { entity_id: switch.garage_opener_double }
          - <<: *square
            template: [opening, square]
            entity: cover.gate_switch_gate
            name: Gate
            icon: "[[[ return entity.state === 'closed' ? 'mdi:gate' : 'mdi:gate-open' ]]]"
            tap_action:
              action: perform-action
              perform_action: cover.toggle
              target: { entity_id: cover.gate_switch_gate }
          - { <<: *lock, entity: lock.w_garage_entry_deadbolt, name: Garage entry }
          - { <<: *heading, name: Up next }
          - type: custom:button-card
            template: agenda
            variables:
              calendars: *calendars
              count: 4
            grid_options: { columns: 12, rows: 4 }

      # Column 3: the gate camera, then a line each for the other views
      - type: grid
        cards:
          - { <<: *heading, name: Gate }
          - { <<: *gate_camera, grid_options: { columns: 12, rows: 4 } }
          - { <<: *heading, name: Around the house }
          - <<: *summary
            name: Lights
            icon: mdi:lightbulb
            variables:
              tint: "#ffd60a"
              ids: *lights
              alert: "[[[ return variables.ids.some((id) => states[id] && states[id].state === 'on') ]]]"
              text: |
                [[[
                  const n = variables.ids.filter((id) => states[id] && states[id].state === 'on').length;
                  return n === 0 ? 'All off' : n === 1 ? '1 light on' : n + ' lights on';
                ]]]
            tap_action:
              action: navigate
              navigation_path: "[[[ return '/' + window.location.pathname.split('/')[1] + '/lights' ]]]"
          - <<: *summary
            name: Security
            icon: mdi:shield-home
            variables:
              tint: "#ff9f0a"
              openings: *openings
              locks: *locks
              alert: >-
                [[[ return variables.openings.some((id) => states[id] && states[id].state === 'on')
                  || variables.locks.some((id) => states[id] && states[id].state === 'unlocked') ]]]
              text: |
                [[[
                  const open = variables.openings.filter((id) => states[id] && states[id].state === 'on').length;
                  const unlocked = variables.locks.filter((id) => states[id] && states[id].state === 'unlocked').length;
                  return (open === 0 ? 'All closed' : open + ' open') + ' · '
                    + (unlocked === 0 ? 'all locked' : unlocked + ' unlocked');
                ]]]
            tap_action:
              action: navigate
              navigation_path: "[[[ return '/' + window.location.pathname.split('/')[1] + '/security' ]]]"
          - <<: *summary
            entity: climate.hot_tub_temperature
            name: Hot tub
            icon: mdi:hot-tub
            variables:
              tint: "#ff9f0a"
              alert: "[[[ return entity.attributes.hvac_action === 'heating' ]]]"
              text: |
                [[[
                  const water = Math.round(Number((states['sensor.hot_tub_current_temperature'] || {}).state));
                  const jets = ['fan.hot_tub_jets_1', 'fan.hot_tub_jets_2'].some((id) => states[id] && states[id].state === 'on');
                  return (isNaN(water) ? '' : water + '° · ')
                    + (entity.attributes.hvac_action === 'heating' ? 'Heating' : 'Ready') + (jets ? ' · Jets on' : '');
                ]]]
            tap_action:
              action: navigate
              navigation_path: "[[[ return '/' + window.location.pathname.split('/')[1] + '/hot-tub' ]]]"

  # ------------------------------------------------------------------ Lights
  - title: Lights
    path: lights
    icon: mdi:lightbulb
    type: sections
    max_columns: 3
    background: *wallpaper
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:button-card
            template: title
            variables: { title: Lights }
            grid_options: { columns: 12, rows: 1 }
          - type: custom:button-card
            template: nav
            variables: { active: lights }
            grid_options: { columns: 24, rows: 1 }

      - type: grid
        cards:
          - { <<: *heading, name: Living room }
          - { <<: *toggle, entity: light.lr_lamp_dimmer, name: Lamp 1, icon: mdi:floor-lamp }
          - { <<: *toggle, entity: light.lr_lamp_dimmer_2, name: Lamp 2, icon: mdi:floor-lamp }
          - { <<: *toggle, entity: light.kauf_bulb_304d85_kauf_bulb, name: Table lamp, icon: mdi:lamp }
          - { <<: *toggle, entity: light.workout_room_dimmer_switch_light, name: Workout, icon: mdi:dumbbell }
          - { <<: *heading, name: Man cave }
          - { <<: *toggle, entity: light.man_cave, name: Man cave, icon: mdi:ceiling-light }
          - { <<: *toggle, entity: light.bar_lights, name: Bar, icon: mdi:glass-cocktail }
          - { <<: *toggle, entity: light.back_bar, name: Back bar, icon: mdi:bottle-wine }
          - { <<: *heading, name: Scenes }
          - <<: *square
            entity: input_boolean.normal_lights
            name: Normal
            icon: mdi:lightbulb-on
            variables: { tint: "#ffb800" }
            tap_action:
              action: perform-action
              perform_action: input_boolean.turn_on
              target: { entity_id: input_boolean.normal_lights }
          - <<: *square
            entity: input_boolean.go_bills
            name: Go Bills
            icon: mdi:football
            variables: { tint: "#0a6cff" }
            tap_action:
              action: perform-action
              perform_action: input_boolean.turn_on
              target: { entity_id: input_boolean.go_bills }
          - <<: *square
            entity: input_boolean.go_pokes
            name: Go Pokes
            icon: mdi:football-helmet
            variables: { tint: "#a2845e" }
            tap_action:
              action: perform-action
              perform_action: input_boolean.turn_on
              target: { entity_id: input_boolean.go_pokes }

      - type: grid
        cards:
          - { <<: *heading, name: Garage }
          - { <<: *toggle, entity: switch.garage_lights_main, name: Main, icon: mdi:ceiling-light-multiple }
          - { <<: *toggle, entity: switch.garageworkbenchlights, name: Workbench, icon: mdi:hammer-wrench }
          - { <<: *toggle, entity: switch.garage_kennel_lights, name: Kennel, icon: mdi:dog-side }
          - { <<: *toggle, entity: light.kauf_garage_patio, name: Garage patio, icon: mdi:outdoor-lamp }
          - { <<: *toggle, entity: light.garage_bulb_1, name: Bulb 1, icon: mdi:lightbulb }
          - { <<: *toggle, entity: light.garage_bulb_2, name: Bulb 2, icon: mdi:lightbulb }
          - { <<: *toggle, entity: light.garage_bulb_3, name: Bulb 3, icon: mdi:lightbulb }

      - type: grid
        cards:
          - { <<: *heading, name: Outdoor }
          - { <<: *toggle, entity: switch.front_porch, name: Front porch, icon: mdi:coach-lamp }
          - { <<: *toggle, entity: light.back_porch_light_switch_light, name: Back porch, icon: mdi:coach-lamp-variant }
          - { <<: *toggle, entity: switch.back_patio_lights, name: Patio lights, icon: mdi:string-lights, variables: { tint: "#ff375f" } }
          - { <<: *toggle, entity: input_boolean.landscapelt_toggle, name: Landscape, icon: mdi:spotlight-beam, variables: { tint: "#30b457" } }
          - { <<: *toggle, entity: switch.hot_tub_lights, name: Hot tub, icon: mdi:hot-tub, variables: { tint: "#af52de" } }
          - { <<: *heading, name: Everything }
          - <<: *summary
            name: All lights off
            icon: mdi:power
            custom_fields: { c: "" }
            variables:
              tint: "#ffd60a"
              ids: *lights
              alert: "[[[ return variables.ids.some((id) => states[id] && states[id].state === 'on') ]]]"
              text: |
                [[[
                  const n = variables.ids.filter((id) => states[id] && states[id].state === 'on').length;
                  return n === 0 ? 'Nothing is on' : n === 1 ? '1 light on' : n + ' lights on';
                ]]]
            tap_action:
              action: perform-action
              perform_action: homeassistant.turn_off
              target:
                entity_id: *lights
              confirmation:
                text: Turn every light off?

  # ------------------------------------------------------------------ Security
  - title: Security
    path: security
    icon: mdi:shield-home
    type: sections
    max_columns: 3
    background: *wallpaper
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:button-card
            template: title
            variables: { title: Security }
            grid_options: { columns: 12, rows: 1 }
          - type: custom:button-card
            template: nav
            variables: { active: security }
            grid_options: { columns: 24, rows: 1 }

      - type: grid
        cards:
          - { <<: *heading, name: Locks }
          - { <<: *lock, entity: lock.touchscreen_deadbolt_z_wave_plus, name: Back porch }
          - { <<: *lock, entity: lock.w_garage_entry_deadbolt, name: W garage entry }
          - { <<: *lock, entity: lock.touchscreen_deadbolt_z_wave_plus_2, name: E garage entry }
