  # ------------------------------------------------------------------ Media
  # The man cave's movie setup (projector, mini-split, lights through the two scripts) and Spotify.
  - title: Media
    path: media
    icon: mdi:television-play
    type: sections
    max_columns: 3
    background: *wallpaper
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:button-card
            template: title
            variables: { title: Media }
            grid_options: { columns: 12, rows: 1 }
          - type: custom:button-card
            template: nav
            variables: { active: media }
            grid_options: { columns: 24, rows: 1 }

      # Column 1: the man cave scripts as big tap targets (white while running), then its climate
      - type: grid
        cards:
          - { <<: *heading, name: Man cave }
          - <<: *square
            entity: script.prep_mancave
            name: Prep
            icon: mdi:projector
            grid_options: { columns: 6, rows: 2 }
            variables:
              tint: "#0a84ff"
              text: "[[[ return entity.state === 'on' ? 'Starting…' : 'Projector & lights' ]]]"
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target: { entity_id: script.prep_mancave }
          - <<: *square
            entity: script.shut_down_mancave
            name: Shut down
            icon: mdi:projector-off
            grid_options: { columns: 6, rows: 2 }
            variables:
              tint: "#ff453a"
              text: "[[[ return entity.state === 'on' ? 'Shutting down…' : 'Everything off' ]]]"
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target: { entity_id: script.shut_down_mancave }
              confirmation:
                text: Shut down the man cave (projector, lights and mini-split)?
          - { <<: *heading, name: Climate }
          - { <<: *climate, entity: climate.man_cave, name: Mini-split, icon: mdi:air-conditioner }
          - { <<: *info, entity: sensor.man_cave_humidity, name: Humidity, icon: mdi:water-percent }

      # Column 2: the man cave lights
      - type: grid
        cards:
          - { <<: *heading, name: Lights }
          - { <<: *toggle, entity: light.man_cave, name: Man cave, icon: mdi:ceiling-light }
          - { <<: *toggle, entity: light.bar_lights, name: Bar, icon: mdi:glass-cocktail }
          - { <<: *toggle, entity: light.back_bar, name: Back bar, icon: mdi:bottle-wine }
          - { <<: *toggle, entity: input_boolean.alexa_bar_signs_2, name: Bar signs, icon: mdi:sign-text }

      # Column 3: Spotify, wherever it is playing (the hub, an Echo, the AVR). Tap the top tile for
      # volume and the device picker.
      - type: grid
        cards:
          - { <<: *heading, name: Spotify }
          - <<: *info
            entity: media_player.spotify_beauhill
            grid_options: { columns: 12, rows: 1 }
            name: "[[[ return entity.attributes.media_title || 'Spotify' ]]]"
            icon: mdi:spotify
            variables:
              lit: false
              accent: "[[[ return entity.state === 'playing' ]]]"
              tint: "#1ed760"
              text: |
                [[[
                  const a = entity.attributes;
                  if (entity.state === 'playing' || entity.state === 'paused')
                    return [a.media_artist, a.source].filter(Boolean).join(' · ') + (entity.state === 'paused' ? ' · Paused' : '');
                  return 'Nothing playing';
                ]]]
            tap_action: { action: more-info }
          - <<: *square
            entity: media_player.spotify_beauhill
            name: Back
            icon: mdi:skip-previous
            variables: { lit: false, text: "" }
            tap_action:
              action: perform-action
              perform_action: media_player.media_previous_track
              target: { entity_id: media_player.spotify_beauhill }
          - <<: *square
            entity: media_player.spotify_beauhill
            name: "[[[ return entity.state === 'playing' ? 'Pause' : 'Play' ]]]"
            icon: "[[[ return entity.state === 'playing' ? 'mdi:pause' : 'mdi:play' ]]]"
            variables: { lit: false, text: "" }
            tap_action:
              action: perform-action
              perform_action: media_player.media_play_pause
              target: { entity_id: media_player.spotify_beauhill }
          - <<: *square
            entity: media_player.spotify_beauhill
            name: Next
            icon: mdi:skip-next
            variables: { lit: false, text: "" }
            tap_action:
              action: perform-action
              perform_action: media_player.media_next_track
              target: { entity_id: media_player.spotify_beauhill }

  # ------------------------------------------------------------------ Upkeep
  # Home maintenance. Set up by homeassistant/scripts/setup_maintenance.py from
  # homeassistant/maintenance/tasks.yaml; the reminders go to the phones listed there.
  - title: Upkeep
    path: upkeep
    icon: mdi:hammer-wrench
    type: sections
    max_columns: 3
    background: *wallpaper
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:button-card
            template: title
            variables: { title: Upkeep }
            grid_options: { columns: 12, rows: 1 }
          - type: custom:button-card
            template: nav
            variables: { active: upkeep }
            grid_options: { columns: 24, rows: 1 }

      # Column 1: the weekly hot tub water test. Tap a reading to type what the strip says, then
      # tap Water test to save them all to the log. Targets are Hot Spring's for the FreshWater
      # salt system.
      - type: grid
        cards:
          - { <<: *heading, name: Hot tub water }
          - <<: *task
            entity: input_datetime.maint_hot_tub_test
            name: Water test
            grid_options: { columns: 12, rows: 1 }
            variables:
              text: |
                [[[
                  const n = variables.days;
                  return (n === null ? 'Not tested yet' : n < 0 ? 'Overdue' : n === 0 ? 'Due today'
                    : 'Next in ' + n + (n === 1 ? ' day' : ' days')) + ' · tap to save readings';
                ]]]
            tap_action:
              action: perform-action
              perform_action: script.maint_log_water_test
              confirmation:
                text: Save these readings as today's water test?
          - <<: *reading
            entity: input_number.maint_tub_fc
            name: Free chlorine
            variables: { lo: 1, hi: 5, low: raise salt output or boost, high: lower salt output }
          - <<: *reading
            entity: input_number.maint_tub_ph
            name: pH
            variables: { lo: 7.2, hi: 7.8, low: add pH increaser, high: add pH decreaser }
          - <<: *reading
            entity: input_number.maint_tub_ta
            name: Alkalinity
            variables: { lo: 40, hi: 120, low: add alkalinity increaser, high: add pH decreaser }
          - <<: *reading
            entity: input_number.maint_tub_ch
            name: Calcium
            variables: { lo: 25, hi: 75, low: add calcium increaser, high: partial drain & refill }
          - <<: *reading
            entity: input_number.maint_tub_salt
            name: Salt
            variables: { lo: 1500, hi: 2000, low: add salt, high: partial drain & refill }
          - { <<: *heading, name: Added to the tub }
          - type: custom:button-card
            section_mode: true
            show_icon: false
            show_name: false
            tap_action: { action: none }
            hold_action: { action: none }
            styles:
              card:
                - padding: 0 14px
                - background: rgba(22, 24, 34, 0.44)
                - backdrop-filter: blur(24px) saturate(1.6)
                - -webkit-backdrop-filter: blur(24px) saturate(1.6)
                - border: none
                - border-radius: 20px
                - box-shadow: inset 0 0.5px 0 0 rgba(255, 255, 255, 0.20), 0 10px 30px -12px rgba(0, 0, 0, 0.35)
                - cursor: default
              grid:
                - grid-template-areas: '"a b c d e"'
                - grid-template-columns: repeat(5, auto)
                - justify-content: space-between
                - align-content: center
            custom_fields:
              a: { card: { type: custom:button-card, template: dose_chip, name: "pH −", variables: { chemical: pH decreaser } } }
              b: { card: { type: custom:button-card, template: dose_chip, name: "pH +", variables: { chemical: pH increaser } } }
              c: { card: { type: custom:button-card, template: dose_chip, name: Alkalinity, variables: { chemical: Alkalinity increaser } } }
              d: { card: { type: custom:button-card, template: dose_chip, name: Shock, variables: { chemical: Shock } } }
              e: { card: { type: custom:button-card, template: dose_chip, name: Salt, variables: { chemical: Salt } } }
            grid_options: { columns: 12, rows: 1 }

      # Column 2: the seven most pressing jobs, re-sorted as dates change.
      - type: grid
        cards:
          - { <<: *heading, name: Up next }
          - { <<: *slot, variables: { index: 0, skip: [input_datetime.maint_hot_tub_test] } }
          - { <<: *slot, variables: { index: 1, skip: [input_datetime.maint_hot_tub_test] } }
          - { <<: *slot, variables: { index: 2, skip: [input_datetime.maint_hot_tub_test] } }
          - { <<: *slot, variables: { index: 3, skip: [input_datetime.maint_hot_tub_test] } }
          - { <<: *slot, variables: { index: 4, skip: [input_datetime.maint_hot_tub_test] } }
          - { <<: *slot, variables: { index: 5, skip: [input_datetime.maint_hot_tub_test] } }
          - { <<: *slot, variables: { index: 6, skip: [input_datetime.maint_hot_tub_test] } }

      # Column 3: what the equipment reports about itself, and the way to every job.
      - type: grid
        cards:
          - { <<: *heading, name: Around the house }
          - <<: *info
            entity: binary_sensor.main_air_filter
            name: Thermostat
            icon: mdi:thermostat
            grid_options: { columns: 12, rows: 1 }
            variables:
              lit: false
              tint: "#ff9f0a"
              flags:
                binary_sensor.main_air_filter: Change the filter
                binary_sensor.main_uv_lamp: Replace the UV lamp
                binary_sensor.main_service: Service due
              accent: "[[[ return Object.keys(variables.flags).some((id) => states[id] && states[id].state === 'on') ]]]"
              text: |
                [[[
                  const on = Object.entries(variables.flags).filter(([id]) => states[id] && states[id].state === 'on').map(([, t]) => t);
                  return on.length ? on.join(' · ') : 'No reminders';
                ]]]
            triggers_update: [binary_sensor.main_uv_lamp, binary_sensor.main_service]
          - <<: *info
            entity: water_heater.electric_water_heater
            name: Water heater
            icon: mdi:water-boiler
            grid_options: { columns: 12, rows: 1 }
            variables:
              lit: false
              tint: "#ff9f0a"
              health: "[[[ return Number((states['sensor.electric_water_heater_tank_health'] || {}).state) ]]]"
              alerts: "[[[ return Number((states['sensor.electric_water_heater_alert_count'] || {}).state) || 0 ]]]"
              accent: "[[[ return variables.alerts > 0 || variables.health < 80 ]]]"
              text: |
                [[[
                  return (isNaN(variables.health) ? 'Tank health unknown' : 'Tank health ' + Math.round(variables.health) + '%')
                    + ' · ' + (variables.alerts === 0 ? 'no alerts' : variables.alerts === 1 ? '1 alert' : variables.alerts + ' alerts');
                ]]]
            triggers_update: [sensor.electric_water_heater_tank_health, sensor.electric_water_heater_alert_count]
          - type: custom:button-card
            template: batteries
            grid_options: { columns: 12, rows: 3 }
          - { <<: *heading, name: Everything }
          - <<: *summary
            name: All tasks
            icon: mdi:format-list-checks
            triggers_update: *upkeep_tasks
            variables:
              tint: "#ff9f0a"
              tasks: *upkeep_tasks
              counts: |
                [[[
                  const now = new Date();
                  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                  const c = { late: 0, soon: 0, unset: 0 };
                  variables.tasks.forEach((id) => {
                    const s = states[id] && states[id].state;
                    if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '') || s < '2001') { c.unset += 1; return; }
                    const [y, m, d] = s.split('-').map(Number);
                    const n = Math.round((new Date(y, m - 1, d) - t0) / 86400000);
                    if (n < 0) c.late += 1; else if (n <= 30) c.soon += 1;
                  });
                  return c;
                ]]]
              alert: "[[[ return variables.counts.late > 0 ]]]"
              text: |
                [[[
                  const c = variables.counts, parts = [];
                  if (c.late) parts.push(c.late + ' overdue');
                  parts.push(c.soon ? c.soon + ' due this month' : 'nothing due this month');
                  if (c.unset) parts.push(c.unset + ' not set');
                  return parts.join(' · ');
                ]]]
            tap_action:
              action: navigate
              navigation_path: "[[[ return '/' + window.location.pathname.split('/')[1] + '/upkeep-tasks' ]]]"

